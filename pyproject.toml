[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "survival-agent"
version = "0.1.0"
description = "Bounded experimental survival agent models and search"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26.4,<3", "torch>=2.10.0,<3", "safetensors>=0.7.0,<1"]

[project.optional-dependencies]
language = ["transformers>=5.10.0,<6", "Jinja2>=3.1.6,<4"]

[tool.setuptools.packages.find]
include = ["survival_agent*"]

[tool.setuptools.package-data]
survival_agent = ["configs/*.json", "communication.schema.json"]
